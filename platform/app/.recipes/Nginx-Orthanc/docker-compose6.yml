# Reference:
# - https://docs.docker.com/compose/compose-file
# - https://eclipsesource.com/blogs/2018/01/11/authenticating-reverse-proxy-with-keycloak/

services:
  # Exposed server that's handling incoming web requests
  ohif_viewer:
    build:
      # Project root
      context: ./../../../../
      # Relative to context
      dockerfile: platform/app/.recipes/Nginx-Orthanc/dockerfile
      args:
        - QUICK_BUILD=true
    image: webapp:v3.11.0-beta.56
    container_name: ohif_iCRco
    environment:
      - APP_CONFIG=config/docker-nginx-orthanc.js  
      - DOCKER_BUILDKIT=1
      - REACT_APP_TITLE=iCRco Viewer
    volumes:
      # Nginx config (optional override)
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      # Override the config at runtime if needed (the build already includes it)
      - ./config/docker-nginx-orthanc.js:/var/www/html/app-config.js:ro
      - ./config/custom-index.html:/var/www/html/index.html:ro
      # Logs
      - ./logs/nginx:/var/log/nginx
    ports:
      - '443:443' # SSL
      - '80:80' # Web
    depends_on:
      - orthanc
    restart: on-failure
    networks:
      - pacs

  # LINK: https://hub.docker.com/r/jodogne/orthanc-plugins/
  orthanc:
    image: jodogne/orthanc-plugins
    hostname: orthanc
    container_name: orthancPACS
    volumes:
      # Config
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      # Persist data
      - ./volumes/orthanc-db/:/var/lib/orthanc/db/
    ports:
      - '4242:4242' # Orthanc REST API
      - '8042:8042' # Orthanc HTTP    
    restart: unless-stopped
    networks:
      - pacs

networks:
  pacs:
    external: true